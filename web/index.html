<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>ניהול משימות · קבוצת הדגמה</title>
    <script>
      // Runs before first paint so a dark-theme user never sees a white flash. Mirrors the
      // resolution in src/context/theme.ts; the store takes over once the bundle loads.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('tm-demo-theme') || 'null')
          var preference = (stored && stored.state && stored.state.preference) || 'system'
          var dark =
            preference === 'dark' ||
            (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
